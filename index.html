<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b35">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Statusleiste „default“ (nicht „black-translucent“): kein Inhalt unter der
       Statusleiste, sonst blendet iOS dort einen verwaschenen Verlauf ein.
       Siehe Kommentar „Oberer Rand“ in css/app.css. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="hide&amp;seek">
  <meta name="description" content="Versteckspiel für draußen – mit Fragen, Münzen und Blockaden.">
  <title>hide&amp;seek</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="Startseite">
        <img src="icons/icon.svg" alt="" width="30" height="30">
        <span>hide<b>&amp;</b>seek</span>
      </a>
      <div id="topbar-right"></div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
